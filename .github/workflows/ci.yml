name: implementation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:codecs
      - run: npm run build
      - run: npm run release:check
      - run: node scripts/audit-distributed-assets.mjs > evidence/static-asset-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-build-audit
          path: evidence/static-asset-audit.json
  browser-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        id: chromium
      - run: npm run test:presentation:browser
      - run: node test/disc-browser.mjs
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
      - run: node test/player-native-browser.mjs
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
      - run: npm run test:pipeline:browser
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
      - run: npm run test:codecs:browser
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
      - name: Screen native MSE candidate
        run: npm run test:native:browser
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-candidate-evidence
          path: |
            evidence/
            .local/modern-browser/
