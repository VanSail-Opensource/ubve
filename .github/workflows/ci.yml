name: implementation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:codecs
      - run: npm run build
  browser-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:presentation
      - run: npm run build:disc
      - run: npx playwright install --with-deps chromium
        id: chromium
      - run: npm run test:presentation:browser
      - run: node test/disc-browser.mjs
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-candidate-evidence
          path: evidence/
